<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <style>
      .grid   { stroke: #c9d2d8; stroke-width: 1; }
      .tick   { fill: #607d8b; font-size: 14px; text-anchor: end; }
      .raw    { stroke: #2b6cb0; stroke-width: 2; fill: none; }
      .rdot   { fill: #2b6cb0; }
      .avg    { stroke: #b07500; stroke-width: 3; fill: none; }
      .adot   { fill: #b07500; stroke: #ffffff; stroke-width: 2; }
      .band   { fill: #e6a817; fill-opacity: 0.12; stroke: #b07500; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .note   { fill: #37474f; font-size: 15px; }
      .lgd    { fill: #37474f; font-size: 15px; }
    </style>
  </defs>

  <!-- gridlines + y ticks -->
  <g>
    <line class="grid" x1="60" y1="330" x2="770" y2="330"/><text class="tick" x="52" y="335">100</text>
    <line class="grid" x1="60" y1="255" x2="770" y2="255"/><text class="tick" x="52" y="260">125</text>
    <line class="grid" x1="60" y1="180" x2="770" y2="180"/><text class="tick" x="52" y="185">150</text>
    <line class="grid" x1="60" y1="105" x2="770" y2="105"/><text class="tick" x="52" y="110">175</text>
    <line class="grid" x1="60" y1="30"  x2="770" y2="30"/> <text class="tick" x="52" y="35">200</text>
  </g>

  <!-- first window band: indices 0..12 -->
  <rect class="band" x="60" y="22" width="355" height="316" rx="8"/>
  <text class="note" x="70" y="392">first window: 13 values &#8594; one average</text>
  <line x1="237.5" y1="360" x2="237.5" y2="210" stroke="#b07500" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- raw series -->
  <polyline class="raw" points="60.0,234.0 89.6,312.0 119.2,129.0 148.8,159.0 178.3,294.0 207.9,102.0 237.5,234.0 267.1,231.0 296.7,123.0 326.2,294.0 355.8,234.0 385.4,150.0 415.0,36.0 444.6,306.0 474.2,99.0 503.8,186.0 533.3,99.0 562.9,267.0 592.5,327.0 622.1,270.0 651.7,234.0 681.2,114.0 710.8,87.0 740.4,165.0 770.0,231.0"/>
  <g class="rdot">
    <circle cx="60.0" cy="234.0" r="3.5"/><circle cx="89.6" cy="312.0" r="3.5"/><circle cx="119.2" cy="129.0" r="3.5"/>
    <circle cx="148.8" cy="159.0" r="3.5"/><circle cx="178.3" cy="294.0" r="3.5"/><circle cx="207.9" cy="102.0" r="3.5"/>
    <circle cx="237.5" cy="234.0" r="3.5"/><circle cx="267.1" cy="231.0" r="3.5"/><circle cx="296.7" cy="123.0" r="3.5"/>
    <circle cx="326.2" cy="294.0" r="3.5"/><circle cx="355.8" cy="234.0" r="3.5"/><circle cx="385.4" cy="150.0" r="3.5"/>
    <circle cx="415.0" cy="36.0"  r="3.5"/><circle cx="444.6" cy="306.0" r="3.5"/><circle cx="474.2" cy="99.0" r="3.5"/>
    <circle cx="503.8" cy="186.0" r="3.5"/><circle cx="533.3" cy="99.0" r="3.5"/><circle cx="562.9" cy="267.0" r="3.5"/>
    <circle cx="592.5" cy="327.0" r="3.5"/><circle cx="622.1" cy="270.0" r="3.5"/><circle cx="651.7" cy="234.0" r="3.5"/>
    <circle cx="681.2" cy="114.0" r="3.5"/><circle cx="710.8" cy="87.0" r="3.5"/><circle cx="740.4" cy="165.0" r="3.5"/>
    <circle cx="770.0" cy="231.0" r="3.5"/>
  </g>

  <!-- running average -->
  <polyline class="avg" points="237.5,195.0 326.2,189.0 415.0,201.0 503.8,204.0 592.5,189.0"/>
  <g>
    <circle class="adot" cx="237.5" cy="195.0" r="5"/><circle class="adot" cx="326.2" cy="189.0" r="5"/>
    <circle class="adot" cx="415.0" cy="201.0" r="5"/><circle class="adot" cx="503.8" cy="204.0" r="5"/>
    <circle class="adot" cx="592.5" cy="189.0" r="5"/>
  </g>
  <text class="note" x="248" y="182" fill="#b07500">145</text>
  <text class="note" x="603" y="176" fill="#b07500">147</text>

  <!-- legend -->
  <g>
    <line class="raw" x1="500" y1="386" x2="530" y2="386"/><circle class="rdot" cx="515" cy="386" r="3.5"/>
    <text class="lgd" x="538" y="391">25 raw values</text>
    <line class="avg" x1="500" y1="408" x2="530" y2="408"/><circle class="adot" cx="515" cy="408" r="5"/>
    <text class="lgd" x="538" y="413">average: window 13, stride 3</text>
  </g>
</svg>
